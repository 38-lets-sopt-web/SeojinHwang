<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>자기소개</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <div class="left">
                <img class="profile" src="images/usagi.jpg" alt="profile image">
            </div>
            
            <div class="center">
                <h4>서진이의 블로그</h4>
                <h6>환영합니다!</h6>        
            </div>

            <div class="right">
                <a href="https://github.com/38-lets-sopt-web/SeojinHwang" target="_blank">
                    <img class="git" src="images/git_logo.png" alt="github link">
                </a>
            </div>
        </header>

        <section>
            <nav>
                <ul>
                    <li><a href="#photo" class="top">포토덤프</a></li>
                    <li><a href="#like">좋아하는 것</a></li>
                    <li><a href="#interest">내 관심사</a></li>
                    <li><a href="#message" class="bottom">To. 웹왔니</a></li>
                </ul>
            </nav>

            <div class="content">
                <section id="photo" class="sect">
                    <h3>📸 포토덤프</h3>
                    <div class="photo-dump">
                        <img src="images/ramen.jpg" alt="ramen" class="img1">
                        <img src="images/anime.jpg" alt="room" class="img2">
                        <img src="images/me1.jpg" alt="my picture" class="img3">
                        <img src="images/me2.jpg" alt="my picture" class="img4">
                        <img src="images/sopt.jpg" alt="sopt" class="img5">
                        <img src="images/me3.jpg" alt="my picture" class="img6">
                    </div>
                </section>

                <section id="like" class="sect">
                    <h3>💖 좋아하는 것: 먼작귀</h3>
                    <div class="photo-scroll">
                        <img src="images/chii1.jpg" alt="chiikawa">
                        <img src="images/usa1.jpg" alt="usagi">
                        <img src="images/chii2.jpg" alt="chiikawa">
                        <img src="images/hachi1.jpg" alt="hachiware">
                        <img src="images/chii3.jpg" alt="chiikawa">
                        <img src="images/usa2.jpg" alt="usagi">
                        <img src="images/hachi2.jpg" alt="hashiwawre">
                        <img src="images/together.jpg" alt="chiikawa friends">
                    </div>
                </section>

                <section id="interest" class="sect">
                    <h3>💫 내 관심사</h3>
                    <div class="card-list">
                        <article class="card">
                            <img src="images/ocean.jpg" alt="ocean">
                            <h4>✨바다</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                                
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/frieren.jpg" alt="frieren">
                            <h4>✨장송의 프리렌</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                              
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/strawberry.jpg" alt="strawberry">
                            <h4>✨딸기</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                               
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/tws.jpg" alt="tws dohoon">
                            <h4>✨투어스 도훈</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                               
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/LG.jpg" alt="LG TWINS">
                            <h4>✨야구</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                               
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/buldak.jpg" alt="buldak">
                            <h4>✨불닭볶음면</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                               
                            </div>
                        </article>

                        <article class="card">
                            <img src="images/overwatch.jpg" alt="overwatch">
                            <h4>✨오버워치</h4>
                            <div class="btn-group">
                                <button class="good">좋아요</button>
                                <button class="bad">싫어요</button>                               
                            </div>
                        </article>
                    </div>
                </section>

                <section id="message" class="sect">
                    <h3>To. 웹왔니</h3>
                    <div class="letter">
                        <p>어렵다</p>
                        <p>앞으로 더 열심히 하겠습니다!!</p>
                    </div>
                </section>
            </div>

        </section>

        <footer>
            <h4>끝!</h4>
        </footer>
    </body>
</html>
